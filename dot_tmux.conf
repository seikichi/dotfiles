# .tmux.conf

set-window-option -g automatic-rename off
set-option -g visual-bell off

# Set the prefix to ^Z.
unbind C-b
set-option -g prefix C-z
bind-key C-z send-prefix

# screen ^C c 
unbind ^C
bind ^C new-window
unbind c
bind c new-window

# bind ^SPC next-window
unbind " "
bind " " next-window
unbind "@"
bind "@" next-layout

# title A
unbind A
bind A command-prompt "rename-window %%"

# kill K k
unbind K
bind K confirm-before "kill-window"
unbind k
bind k confirm-before "kill-window"

# split
unbind |
bind | split-window -h
bind - split-window -v

# others
set -g history-limit 50000
