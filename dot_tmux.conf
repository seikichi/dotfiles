# .tmux.conf

set-window-option -g automatic-rename off
set-option -g visual-bell off

# Set the prefix to ^Z.
unbind C-b
set-option -g prefix C-z
bind-key C-z send-prefix

# screen ^C c 
unbind ^C
bind ^C new-window
unbind c
bind c new-window

# bind ^SPC next-window
unbind " "
bind " " next-window
unbind "@"
bind "@" next-layout

# title A
unbind A
bind A command-prompt "rename-window %%"

# kill K k
unbind K
bind K confirm-before "kill-window"
unbind k
bind k confirm-before "kill-window"

# split
unbind |
bind | split-window -h
bind - split-window -v

# others
set -g history-limit 50000

# 24bit color: 外側の端末 (Windows Terminal, TERM=xterm-256color) へ RGB で出力し、
# 内側のアプリ (Emacs など) にも COLORTERM で 24bit 対応を知らせる
set -as terminal-features ",xterm-256color:RGB"
set-environment -g COLORTERM truecolor
